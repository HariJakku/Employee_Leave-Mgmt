server:
  port: ${PORT:8080}

spring:
  application:
    name: employee-leave-erp


  # Profile-specific config loaded from application-{profile}.yml
  profiles:
    active: dev
    datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update          # Use 'validate' in prod after first run
    show-sql: false             # Set to true in dev profile for debugging
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        default_batch_fetch_size: 25

  # Jackson
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# Spring Boot Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# SpringDoc / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true

# Custom application properties
app:
  jwt:
    secret: ${JWT_SECRET:ThisIsAVeryLongSecretKeyForJWTThatShouldBeAtLeast512BitsLongForHS512Algorithm!}
    expiration: ${JWT_EXPIRATION:86400000}    # 24 hours in ms
    refresh-expiration: ${JWT_REFRESH:604800000}  # 7 days

  ai:
    provider: gemini
    gemini:
      api-key: ${AI_API_KEY:}
      model: gemini-1.5-flash
      base-url: https://generativelanguage.googleapis.com/v1beta

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
